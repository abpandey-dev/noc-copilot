<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<text x="40" y="52" font-size="28" fill="#0F172A" font-weight="700">NOC Copilot: how it works</text>
<text x="40" y="80" font-size="15" fill="#475569">An AI agent that investigates 5G network incidents like a NOC engineer, and proves it on a benchmark</text>
<rect x="24" y="104" width="1152" height="290" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="44" y="132" font-size="13" fill="#1D4ED8" font-weight="700" letter-spacing="1">INVESTIGATE · one incident, end to end</text>
<rect x="44" y="144" width="250" height="160" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
<text x="62" y="174" font-size="15" fill="#0F766E" font-weight="700">Fault simulator</text>
<text x="62" y="200" font-size="12" fill="#334155">4-city 5G network: core,</text>
<text x="62" y="220" font-size="12" fill="#334155">4 routers, 16 sites, 48 cells</text>
<text x="62" y="240" font-size="12" fill="#334155">5 fault types + noise alarms</text>
<text x="62" y="260" font-size="12" fill="#334155">primary alarm sometimes lost</text>
<text x="62" y="280" font-size="12" fill="#334155">ground truth kept for scoring</text>
<rect x="340" y="144" width="300" height="160" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="358" y="174" font-size="15" fill="#6D28D9" font-weight="700">Investigation loop</text>
<text x="624" y="174" font-size="11" fill="#D97757" font-weight="700" text-anchor="end">CLAUDE</text>
<text x="358" y="200" font-size="12" fill="#334155">reads alarms, KPIs, topology,</text>
<text x="358" y="220" font-size="12" fill="#334155">change log and runbooks</text>
<text x="358" y="240" font-size="12" fill="#334155">parallel tool calls</text>
<text x="358" y="260" font-size="12" fill="#334155">every call audit-logged</text>
<text x="358" y="280" font-size="12" fill="#334155">answers when confident</text>
<rect x="686" y="144" width="220" height="160" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="704" y="174" font-size="15" fill="#1D4ED8" font-weight="700">Structured RCA</text>
<text x="704" y="200" font-size="12" fill="#334155">fault type + exact entity</text>
<text x="704" y="220" font-size="12" fill="#334155">evidence list</text>
<text x="704" y="240" font-size="12" fill="#334155">any second root cause</text>
<text x="704" y="260" font-size="12" fill="#334155">JSON schema enforced</text>
<rect x="952" y="144" width="204" height="160" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
<text x="970" y="174" font-size="15" fill="#15803D" font-weight="700">Human approval</text>
<text x="970" y="200" font-size="12" fill="#334155">fixes are proposals</text>
<text x="970" y="220" font-size="12" fill="#334155">with a risk level</text>
<text x="970" y="240" font-size="12" fill="#334155">tools are read-only</text>
<text x="970" y="260" font-size="12" fill="#334155">AI changes nothing</text>
<line x1="294" y1="224" x2="336" y2="224" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="640" y1="224" x2="682" y2="224" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="906" y1="224" x2="948" y2="224" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="44" y="336" font-size="11" fill="#1D4ED8" font-weight="700" letter-spacing="1">7 READ-ONLY TOOLS THE AGENT CAN CALL</text>
<rect x="44" y="348" width="101.2" height="26" rx="13.0" fill="#DBEAFE"/><text x="94.6" y="365.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">list_alarms</text>
<rect x="153.2" y="348" width="108.4" height="26" rx="13.0" fill="#DBEAFE"/><text x="207.39999999999998" y="365.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">get_topology</text>
<rect x="269.6" y="348" width="79.6" height="26" rx="13.0" fill="#DBEAFE"/><text x="309.40000000000003" y="365.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">get_kpis</text>
<rect x="357.20000000000005" y="348" width="151.6" height="26" rx="13.0" fill="#DBEAFE"/><text x="433.00000000000006" y="365.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">find_kpi_anomalies</text>
<rect x="516.8000000000001" y="348" width="151.6" height="26" rx="13.0" fill="#DBEAFE"/><text x="592.6" y="365.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">get_kpi_timeseries</text>
<rect x="676.4000000000001" y="348" width="122.8" height="26" rx="13.0" fill="#DBEAFE"/><text x="737.8000000000001" y="365.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">get_change_log</text>
<rect x="807.2" y="348" width="130.0" height="26" rx="13.0" fill="#DBEAFE"/><text x="872.2" y="365.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">search_runbooks</text>
<line x1="490" y1="304" x2="490" y2="344" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="24" y="414" width="1152" height="266" rx="14" fill="#F5F3FF" stroke="#DDD6FE"/>
<text x="44" y="442" font-size="13" fill="#6D28D9" font-weight="700" letter-spacing="1">BENCHMARK · three suites, scored against ground truth</text>
<rect x="44" y="454" width="355" height="150" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="62" y="484" font-size="15" fill="#6D28D9" font-weight="700">Standard (v0.1)</text>
<text x="62" y="510" font-size="12" fill="#334155">one root cause per incident</text>
<text x="62" y="530" font-size="12" fill="#334155">5 fault types</text>
<text x="62" y="550" font-size="12" fill="#334155">half with the key alarm missing</text>
<rect x="422" y="454" width="355" height="150" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="440" y="484" font-size="15" fill="#6D28D9" font-weight="700">Hard (v0.2)</text>
<text x="440" y="510" font-size="12" fill="#334155">two faults at once</text>
<text x="440" y="530" font-size="12" fill="#334155">cascades that look like other faults</text>
<text x="440" y="550" font-size="12" fill="#334155">planned-maintenance decoys</text>
<rect x="800" y="454" width="356" height="150" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="818" y="484" font-size="15" fill="#6D28D9" font-weight="700">Messy (v0.3)</text>
<text x="818" y="510" font-size="12" fill="#334155">alarm storms (~50-80 alarms)</text>
<text x="818" y="530" font-size="12" fill="#334155">missing KPI data, busy-hour masking</text>
<text x="818" y="550" font-size="12" fill="#334155">two faults an hour apart</text>
<text x="44" y="640" font-size="13" fill="#475569">Each suite also runs a classic alarm-rule baseline (a NOC rulebook). A case is correct only if the exact set of root causes matches.</text>
</svg>

<text x="336" y="644" font-size="12" fill="#475569">topology and the change log</text>
<rect x="608" y="508" width="276" height="172" rx="14" fill="#FFFBEB" stroke="#FDE68A"/>
<text x="628" y="554" font-size="30" fill="#B45309" font-weight="800">95% → 100%</text>
<text x="628" y="584" font-size="14" fill="#0F172A" font-weight="700">one line of domain knowledge</text>
<text x="628" y="608" font-size="12" fill="#475569">the minimal prompt blamed a site</text>
<text x="628" y="626" font-size="12" fill="#475569">in planned maintenance; &quot;planned</text>
<text x="628" y="644" font-size="12" fill="#475569">work is not a fault&quot; fixed it</text>

<text x="336" y="554" font-size="30" fill="#15803D" font-weight="800">20% → 100%</text>
<text x="336" y="584" font-size="14" fill="#0F172A" font-weight="700">when the key alarm is missing</text>
<text x="336" y="608" font-size="12" fill="#475569">rules need every alarm to arrive;</text>

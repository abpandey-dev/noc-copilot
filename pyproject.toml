[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noc-copilot"
version = "0.1.0"
description = "Agentic AI for 5G network operations: root-cause analysis over alarms, KPIs and change logs, with human-in-the-loop remediation and a built-in benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhishek Pandey" }]
dependencies = [
  "anthropic>=1.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
noc = "noc_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noc_copilot = ["runbooks/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
